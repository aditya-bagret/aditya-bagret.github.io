<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Departures</title>
  <meta name="description" content="Aditya Sharma — portfolio and projects.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23111'/%3E%3Crect x='5' y='8' width='22' height='7' fill='%23ffb000'/%3E%3Crect x='5' y='17' width='22' height='7' fill='%23ffb000' opacity='.55'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="frame">
    <header class="top">
      <div class="sign">
        <svg class="glyph" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M6 30 L42 18 L44 22 L30 28 L22 42 L18 42 L22 30 L12 33 L8 38 L5 38 L7 31 Z" fill="currentColor"/>
        </svg>
        <div>
          <p class="eyebrow" id="terminal">Terminal A</p>
          <h1>Departures</h1>
        </div>
      </div>
      <div class="clock" aria-live="off">
        <span id="clock-time">--:--</span>
        <span id="clock-date" class="eyebrow">---</span>
      </div>
    </header>

    <main class="gates" id="gates" aria-label="Links"></main>

    <aside class="ticker" aria-hidden="true">
      <span class="ticker-label">Info</span>
      <div class="ticker-track"><span id="ticker"></span></div>
    </aside>

    <footer class="foot">
      <span id="owner"></span>
      <span class="hint">Press <kbd>1</kbd> or <kbd>2</kbd> to board</span>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
