<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aditya Sharma</title>
  <meta name="description" content="Aditya Sharma — portfolio and projects.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%235a2800'/%3E%3Crect x='1' y='1' width='14' height='14' fill='%23f8a830'/%3E%3Crect x='6' y='3' width='4' height='2' fill='%23fff'/%3E%3Crect x='9' y='5' width='2' height='3' fill='%23fff'/%3E%3Crect x='7' y='8' width='2' height='2' fill='%23fff'/%3E%3Crect x='7' y='11' width='2' height='2' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="world" id="world">
    <div class="sky" aria-hidden="true">
      <div class="stars"></div>
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="cloud c3"></div>
      <div class="hill h1"></div>
      <div class="hill h2"></div>
    </div>

    <header class="hud" aria-hidden="true">
      <div><span id="hud-name">PLAYER</span><b id="score">000000</b></div>
      <div><span>&nbsp;</span><b><i class="coin-icon"></i>×<span id="coins">00</span></b></div>
      <div><span>WORLD</span><b>1-1</b></div>
      <div><span>TIME</span><b id="time">400</b></div>
    </header>

    <section class="title">
      <h1 id="name">Aditya Sharma</h1>
      <p class="tagline" id="tagline"></p>
      <p class="blink" id="prompt">Hit a block to start</p>
    </section>

    <nav id="blocks" aria-label="Links"></nav>

    <div class="player" id="player" aria-hidden="true"></div>
    <div class="ground" aria-hidden="true"></div>

    <p class="controls" aria-hidden="true">
      <span class="desk">← → move &nbsp;·&nbsp; space jump &nbsp;·&nbsp; 1 / 2 warp</span>
      <span class="touch">tap a block</span>
    </p>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
